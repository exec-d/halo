name: Release

# Une version publiée sur GitHub (étiquette vX.Y.Z) reçoit son APK.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Tout l'historique : le numéro de build compte les commits.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test
      # Même clé et même numérotation que la CI (ci.yml) : l'APK s'installe
      # par-dessus une build de la CI, et inversement.
      - run: flutter build apk --debug --build-number=$(( $(git rev-list --count HEAD) + 100 ))
      - run: cp build/app/outputs/flutter-apk/app-debug.apk "halo-${{ github.event.release.tag_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: halo-${{ github.event.release.tag_name }}.apk
